[project]
name = "ingestion-service"
version = "0.1.0"
description = "Receives log envelopes, validates + PII-redacts, publishes to Valkey Streams."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "structlog>=24.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "inferspect-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion_service"]
