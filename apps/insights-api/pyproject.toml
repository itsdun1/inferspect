[project]
name = "insights-api"
version = "0.1.0"
description = "Analytics endpoints over ClickHouse + operator console auth (Postgres-backed)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "clickhouse-connect[async]>=0.7",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "fastapi-users[sqlalchemy]>=13.0",
    "inferspect-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insights_api"]
