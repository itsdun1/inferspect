[project]
name = "app-log-consumer"
version = "0.1.0"
description = "Drains application.v1 stream into ClickHouse."
requires-python = ">=3.11"
dependencies = [
    "faststream[redis]>=0.5",
    "clickhouse-connect[async]>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "inferspect-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_log_consumer"]
