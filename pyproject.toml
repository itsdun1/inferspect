[project]
name = "ollive-monorepo"
version = "0.1.0"
description = "LLM chatbot + inference logging & ingestion platform"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/chatbot-sdk",
    "apps/chat-service",
    "apps/ingestion-service",
    "apps/inference-consumer",
    "apps/app-log-consumer",
    "apps/insights-api",
]

[tool.uv.sources]
inferspect-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = [
    "packages/chatbot-sdk/tests",
    "apps/ingestion-service/tests",
    "apps/chat-service/tests",
    "apps/inference-consumer/tests",
    "apps/app-log-consumer/tests",
    "apps/insights-api/tests",
]
