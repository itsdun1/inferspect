name: ollive

# Production-style compose: builds the Python and Next.js images, wires them
# together with the infra services, fronts everything with Caddy for HTTPS.
# Used on the Oracle VM. For local dev, infra/docker-compose.yml only brings
# up postgres + valkey + clickhouse.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ollive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ollivepass}
      POSTGRES_DB: ${POSTGRES_DB:-ollive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ollive} -d ${POSTGRES_DB:-ollive}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ollive}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ollivepass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ollive}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Native TCP via clickhouse-client — works inside the container even
      # when HTTP loopback bind is flaky (seen on Oracle Cloud where IPv6
      # init fails first and CH binds only on the docker network IP).
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER:-ollive} --password $${CLICKHOUSE_PASSWORD:-ollivepass} -q 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  ingestion-service:
    build:
      context: ..
      dockerfile: Dockerfile.python
    image: ollive/python:dev
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      PII_ENABLED: "${PII_ENABLED:-false}"
      SDK_API_KEY: "${SDK_API_KEY:-}"
    command: ["uvicorn", "ingestion_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      valkey:
        condition: service_healthy

  inference-consumer:
    image: ollive/python:dev
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ollive}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ollivepass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ollive}
    command: ["python", "-m", "faststream", "run", "inference_consumer.main:app"]
    depends_on:
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  app-log-consumer:
    image: ollive/python:dev
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ollive}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ollivepass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ollive}
    command: ["python", "-m", "faststream", "run", "app_log_consumer.main:app"]
    depends_on:
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  insights-api:
    image: ollive/python:dev
    restart: unless-stopped
    environment:
      # ClickHouse — analytics reads
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ollive}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ollivepass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ollive}
      # Postgres — operator + cross-tenant reads (Phase D)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ollive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ollivepass}
      POSTGRES_DB: ${POSTGRES_DB:-ollive}
      # Operator console auth (separate from chat-service)
      CONSOLE_JWT_SECRET: ${CONSOLE_JWT_SECRET:?CONSOLE_JWT_SECRET required}
      CONSOLE_BOOTSTRAP_EMAIL: ${CONSOLE_BOOTSTRAP_EMAIL:-operator@ollive.example.com}
      CONSOLE_BOOTSTRAP_PASSWORD: ${CONSOLE_BOOTSTRAP_PASSWORD:?CONSOLE_BOOTSTRAP_PASSWORD required}
      # SDK — admin/synthetic uses the logger to seed events
      INGESTION_URL: http://ingestion-service:8001/v1/logs
      SDK_API_KEY: ${SDK_API_KEY:-local-dev-sdk-key}
      ALLOWED_ORIGINS: https://insights.${DOMAIN}
    command: ["uvicorn", "insights_api.main:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  chat-service:
    # Built from a STANDALONE Dockerfile that pip-installs the SDK from PyPI
    # (inferspect-sdk[langchain]) — proves chat-service consumes the SDK like
    # any third-party customer would, with no workspace coupling.
    build:
      context: ..
      dockerfile: apps/chat-service/Dockerfile
    image: ollive/chat-service:pypi
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ollive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ollivepass}
      POSTGRES_DB: ${POSTGRES_DB:-ollive}
      INGESTION_URL: http://ingestion-service:8001/v1/logs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ollive.demo}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      COOKIE_SECURE: "true"
      SDK_API_KEY: "${SDK_API_KEY:-}"
    command: ["uvicorn", "chat_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      ingestion-service:
        condition: service_started

  # End-user chat UI. Talks to chat-service only. `chat_session` cookie is
  # scoped to chat.${DOMAIN} (Caddy fronts both this and chat-service under
  # the same subdomain). Locally exposed on host port 3001.
  web-chat:
    build:
      context: ..
      dockerfile: apps/web-chat/Dockerfile
      args:
        # Bundled into the JS at build time. The Next.js app fetches relative
        # paths (e.g. /auth/login) against this base; Caddy rewrites
        # /api/chat/* → chat-service:8000.
        # Base for chat-service calls. The web-chat client posts to
        # ${URL}/auth/login and ${URL}/conversations etc. — Caddy on
        # chat.${DOMAIN} matches /api/chat/* and strips /api/chat (NOT
        # just /api) so backend sees /auth/login, /conversations etc.
        NEXT_PUBLIC_CHAT_API_URL: https://chat.${DOMAIN}/api/chat
    image: ollive/web-chat:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - chat-service

  # Operator console. Talks to insights-api only. `console_session` cookie is
  # scoped to insights.${DOMAIN}. Locally exposed on host port 3002.
  web-insights:
    build:
      context: ..
      dockerfile: apps/web-insights/Dockerfile
      args:
        # Base for insights-api calls. The web-insights client posts to
        # ${URL}/auth/login, ${URL}/admin/users, ${URL}/insights/summary etc.
        # Caddy on insights.${DOMAIN} matches /api/* and strips only /api
        # (NOT /api/insights), so the backend sees /auth/login, /admin/users,
        # /insights/summary. So this base ends at /api, not /api/insights.
        NEXT_PUBLIC_INSIGHTS_API_URL: https://insights.${DOMAIN}/api
    image: ollive/web-insights:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - insights-api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-chat
      - web-insights
      - chat-service
      - insights-api
      - ingestion-service

volumes:
  postgres_data:
  valkey_data:
  clickhouse_data:
  caddy_data:
  caddy_config:
