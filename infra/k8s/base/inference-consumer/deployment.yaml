apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-consumer
  labels:
    app.kubernetes.io/name: inference-consumer
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-consumer
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: inference-consumer
          # NOTE: placeholder image — override in prod overlay.
          image: ollive/inference-consumer:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: VALKEY_URL
              value: redis://valkey:6379/0
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_USER
              value: ollive
            - name: CLICKHOUSE_DB
              value: ollive
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ollive-secrets
                  key: CLICKHOUSE_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
