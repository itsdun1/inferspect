# NOTE: the actual ConfigMap "clickhouse-init" is generated by the root
# base/kustomization.yaml via configMapGenerator, sourcing the canonical
# infra/clickhouse/init.sql so there is a single source of truth shared
# with docker-compose. This file is kept as a placeholder/reference and
# documents that the volumeMount in statefulset.yaml expects key
# "init.sql" on a ConfigMap named "clickhouse-init".
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init-placeholder
  labels:
    app.kubernetes.io/name: clickhouse
data:
  README: |
    The real ConfigMap is generated from ../../clickhouse/init.sql via
    configMapGenerator in the parent kustomization.yaml.
